<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Weavers Wild Runs – Fundraiser</title>
  <style>
    /* RESET & GLOBAL */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      height: 100vh;
      font-family: 'Courier New', monospace;
      color: #ccffcc;
    }

    /* STARFIELD */
    #universe {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #0a0020 0%, #000 70%);
      z-index: 0;
      pointer-events: none;
    }
    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      opacity: 0.7;
      animation: twinkle linear infinite;
    }
    @keyframes twinkle {
      0%,100%{ opacity: 0.3; }
      50%{ opacity: 0.9; }
    }

    /* DESERT STRIP */
    #desert-strip {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 18vh;
      min-height: 100px;
      overflow: hidden;
      z-index: 2;
      pointer-events: none;
    }
    #desert-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      image-rendering: crisp-edges;
      display: block;
    }

    /* MAIN VISUALIZER CANVAS */
    #viz-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      display: block;
      pointer-events: none;
    }

    /* LOGO */
    #logo-container {
      position: fixed;
      top: 28%;
      left: 50%;
      transform: translate(-50%, -50%);
      perspective: 1200px;
      width: min(380px, 70vw);
      height: min(380px, 70vw);
      z-index: 10;
      pointer-events: none;
    }
    @media (min-width: 768px) {
      #logo-container {
        width: 520px;
        height: 520px;
        top: 30%;
      }
    }
    @media (max-width: 600px) {
      #logo-container {
        top: 27%;
        width: 68vw;
        height: 68vw;
      }
    }
    @media (max-width: 380px) {
      #logo-container {
        top: 26.5%;
        width: 72vw;
        height: 72vw;
      }
    }

    #logo-card {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      animation: idleLogo 24s infinite ease-in-out;
    }
    @keyframes idleLogo {
      0%,100% { transform: rotateX(0) rotateY(0); }
      25%     { transform: rotateY(10deg) rotateX(-8deg); }
      50%     { transform: rotateY(-12deg) rotateX(6deg); }
      75%     { transform: rotateY(8deg) rotateX(-10deg); }
    }
    .holo-logo {
      width:100%;
      height:100%;
      background: url('wwr.png') center/contain no-repeat;
      position:relative;
    }
    .effect-mask {
      position:absolute;
      inset:0;
      -webkit-mask: url('wwr.png') center/contain no-repeat;
      mask: url('wwr.png') center/contain no-repeat;
    }
    .foil-shine,.foil-glare,.grain{
      position:absolute;
      inset:0;
    }
    .foil-shine{
      background:linear-gradient(135deg, #88cc99, #d4a373, #aaffaa, #c9b88a, #88cc99);
      background-size:300% 300%;
      mix-blend-mode:overlay;
      opacity:.65;
    }
    .foil-glare{
      background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);
      background-size:200% 200%;
      mix-blend-mode:color-dodge;
    }
    .grain{
      background:url('https://assets.codepen.io/13471/sparkles.gif') repeat;
      background-size:200px;
      mix-blend-mode:soft-light;
      opacity:.4;
    }

    /* AUDIO PLAYER */
    #loader {
      position:fixed;
      top:12px;
      right:12px;
      padding:8px 12px;
      border:3px ridge #aaddbb;
      color:#aaddbb;
      display:flex;
      gap:10px;
      z-index:20;
      background:rgba(10,30,15,0.8);
      border-radius:8px;
      backdrop-filter: blur(4px);
      font-size: 1.2rem;
    }
    #playBtn, #uploadBtn, #disc {
      cursor:pointer;
      font-size:1.5rem;
      line-height:1;
    }
    #disc {
      display:none;
      animation:spin 2s linear infinite;
    }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    #trackName {
      font-size:0.8rem;
      white-space:nowrap;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      align-self: center;
    }
    input[type=file]{ display:none; }

    /* BUTTON GROUP */
    .forest-buttons {
      position: fixed;
      bottom: 18vh;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 15;
      width: 100%;
      max-width: 340px;
      padding: 0 16px;
      pointer-events: auto;
    }

    .btn {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #ccffcc;
      border: 2px solid #88cc99;
      border-radius: 999px;
      background: rgba(20, 40, 25, 0.7);
      box-shadow: 0 0 16px rgba(136, 204, 153, 0.7), inset 0 0 8px rgba(170, 255, 170, 0.25);
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
      text-align: center;
      width: 100%;
      max-width: 300px;
    }

    .btn-donate {
      font-size: 1.3rem;
      padding: 16px 36px;
      border-color: #d4a373;
      color: #ffe8c0;
      background: linear-gradient(135deg, rgba(212,163,115,0.4), rgba(80,50,30,0.6));
      box-shadow: 0 0 32px rgba(212, 163, 115, 0.9);
      max-width: 320px;
      animation: forestBreath 8s infinite ease-in-out;
    }
    @keyframes forestBreath {
      0%,100% { box-shadow: 0 0 32px rgba(212,163,115,0.8); transform: scale(1); }
      50%     { box-shadow: 0 0 45px rgba(212,163,115,1);   transform: scale(1.04); }
    }

    .btn-social, .btn-more {
      padding: 10px 24px;
      font-size: 0.95rem;
      max-width: 260px;
    }

    .social-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }
    .social-row .btn {
      width: auto;
      flex: 1 1 auto;
      min-width: 110px;
    }

    @media (max-width: 500px) {
      .forest-buttons {
        bottom: 14vh;
        gap: 8px;
      }
      .btn-donate {
        font-size: 1.2rem;
        padding: 14px 24px;
      }
      .btn-social, .btn-more {
        padding: 10px 16px;
        font-size: 0.85rem;
      }
      #loader {
        top: 6px;
        right: 6px;
        padding: 5px 10px;
        gap: 6px;
      }
      #trackName { max-width: 90px; }
    }

    @media (max-height: 650px) {
      .forest-buttons { bottom: 12vh; }
    }

    canvas, #universe, #desert-strip {
      pointer-events: none;
    }
    a, #loader, #uploadBtn, #playBtn {
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <div id="universe"></div>

  <div id="desert-strip">
    <canvas id="desert-canvas" width="1920" height="320"></canvas>
  </div>

  <canvas id="viz-canvas"></canvas>

  <div id="logo-container">
    <div id="logo-card">
      <div class="holo-logo">
        <div class="effect-mask">
          <div class="foil-shine" id="shine"></div>
          <div class="foil-glare" id="glare"></div>
          <div class="grain"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="loader">
    <span id="playBtn">▶︎</span>
    <span id="disc">💿</span>
    <span id="uploadBtn">📂</span>
    <span id="trackName">Wild-Runs.mp3</span>
  </div>
  <input type="file" id="fileInput" accept="audio/mpeg">
  <audio id="audio" preload="auto"></audio>

  <div class="forest-buttons">
    <a href="https://www.justgiving.com/page/weaverswildruns?utm_medium=FA&utm_source=CL" target="_blank" class="btn btn-donate">Donate & Support</a>
    
    <div class="social-row">
      <a href="https://www.instagram.com/weaverswildruns/" target="_blank" class="btn btn-social">Instagram</a>
      <a href="https://www.strava.com/athletes/20154088" target="_blank" class="btn btn-social">Strava</a>
      <a href="https://mycodenameisl-netizen.github.io/WeaversWildRuns/more" target="_blank" class="btn btn-social">More</a>
    </div>
  </div>

  <script>
    (function() {
      // ========== AUDIO VISUALIZER – FULL CIRCLE BARS ==========
      const canvas = document.getElementById('viz-canvas');
      const ctx = canvas.getContext('2d');
      const audio = document.getElementById('audio');
      const playBtn = document.getElementById('playBtn');
      const disc = document.getElementById('disc');
      const uploadBtn = document.getElementById('uploadBtn');
      const trackName = document.getElementById('trackName');
      const fileInput = document.getElementById('fileInput');
      
      const logoContainer = document.getElementById('logo-container');

      let audioCtx, analyser, source, dataArray;
      let started = false;
      let vizAlpha = 0;
      let targetVizAlpha = 0;
      const fadeSpeed = 0.03;

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      audio.src = "Wild-Runs.mp3"; 

      function initAudio() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
      }

      function animateViz() {
        requestAnimationFrame(animateViz);

        // Get dynamic logo center
        const logoRect = logoContainer.getBoundingClientRect();
        const centerX = logoRect.left + logoRect.width / 2;
        const centerY = logoRect.top + logoRect.height / 2;

        vizAlpha += (targetVizAlpha - vizAlpha) * fadeSpeed;
        vizAlpha = Math.max(0, Math.min(1, vizAlpha));

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!analyser || vizAlpha < 0.01) {
          return;
        }

        analyser.getByteFrequencyData(dataArray);

        let bass = 0;
        for (let i = 0; i < 40; i++) bass += dataArray[i];
        bass /= (40 * 255);

        const pulse = 80 + bass * 450;

        // Central glow
        const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, pulse);
        grad.addColorStop(0, `rgba(136,204,153,${vizAlpha})`);
        grad.addColorStop(0.4, `rgba(136,204,153,${vizAlpha * 0.5})`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(centerX, centerY, pulse, 0, Math.PI * 2);
        ctx.fill();

        // ===== FIXED BARS – now properly distributed around full circle =====
        const bars = 128;
        for (let i = 0; i < bars; i++) {
          // Map i to a frequency bin – ensures full coverage
          const binIndex = Math.floor((i / bars) * dataArray.length);
          const value = dataArray[binIndex] / 255; // normalize 0..1
          
          const angle = (i / bars) * Math.PI * 2; // full circle
          const length = 140 + value * 600; // base radius + amplitude
          
          const startX = centerX + Math.cos(angle) * 140;
          const startY = centerY + Math.sin(angle) * 140;
          const endX = centerX + Math.cos(angle) * length;
          const endY = centerY + Math.sin(angle) * length;

          ctx.strokeStyle = `rgba(136,204,153,${vizAlpha * (0.4 + bass * 0.6)})`;
          ctx.lineWidth = 6 + bass * 12;
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.lineTo(endX, endY);
          ctx.stroke();
        }
      }
      animateViz();

      playBtn.onclick = () => {
        if (!started) { initAudio(); started = true; }
        if (audio.paused) {
          audio.play();
        } else {
          audio.pause();
        }
      };

      audio.onplay = () => {
        playBtn.textContent = "❚❚";
        disc.style.display = "inline";
        targetVizAlpha = 1;
      };
      audio.onpause = () => {
        playBtn.textContent = "▶︎";
        disc.style.display = "none";
        targetVizAlpha = 0;
      };
      audio.onended = () => { targetVizAlpha = 0; };

      uploadBtn.onclick = () => fileInput.click();
      fileInput.onchange = (e) => {
        const f = e.target.files[0];
        if (f) {
          audio.src = URL.createObjectURL(f);
          trackName.textContent = f.name;
        }
      };

      // ========== STARS ==========
      const universe = document.getElementById('universe');
      for (let i = 0; i < 400; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() * 3 + 1;
        s.style.width = s.style.height = size + 'px';
        s.style.left = Math.random() * 100 + 'vw';
        s.style.top = Math.random() * 100 + 'vh';
        s.style.animationDuration = Math.random() * 40 + 20 + 's';
        universe.appendChild(s);
      }

      // ========== HOLOGRAPHIC SHINE ==========
      const shine = document.getElementById('shine');
      const glare = document.getElementById('glare');
      function logoAnim() {
        const t = performance.now() / 1000;
        shine.style.backgroundPosition = `${50 + Math.sin(t / 8) * 48}% ${50 + Math.cos(t / 8) * 48}%`;
        glare.style.backgroundPosition = `${50 + Math.sin(t / 6) * 45}% ${50 + Math.cos(t / 6) * 45}%`;
        requestAnimationFrame(logoAnim);
      }
      logoAnim();

      // ========== DESERT ==========
      const dCanvas = document.getElementById('desert-canvas');
      const dCtx = dCanvas.getContext('2d');

      function resizeDesert() {
        const parent = dCanvas.parentElement;
        if (!parent) return;
        const rect = parent.getBoundingClientRect();
        dCanvas.width = rect.width;
        dCanvas.height = rect.height;
      }
      window.addEventListener('resize', resizeDesert);
      resizeDesert();

      const colors = {
        duneFar: '#2a140a',
        duneMid: '#4a2a16',
        duneNear: '#7a4a2e',
      };

      let scrollX = 0;
      const speed = 0.28;

      function duneNoise(x) {
        x *= 0.0075;
        return (
          Math.sin(x * 1.0) * 58 +
          Math.sin(x * 2.4) * 34 +
          Math.sin(x * 5.2) * 19 +
          Math.sin(x * 9.0) * 10
        ) + 24;
      }

      function drawDunes() {
        if (!dCanvas.width || !dCanvas.height) return;
        dCtx.clearRect(0, 0, dCanvas.width, dCanvas.height);

        const isMobile = window.innerWidth < 600;
        let yBaseFar = 0.96, yBaseMid = 0.97, yBaseNear = 0.98;
        let amplitudeScale = 0.6;
        
        if (!isMobile) {
          yBaseFar = 0.88;
          yBaseMid = 0.92;
          yBaseNear = 0.96;
          amplitudeScale = 1.0;
        }

        dCtx.fillStyle = colors.duneFar;
        dCtx.beginPath();
        dCtx.moveTo(0, dCanvas.height);
        for (let x = 0; x <= dCanvas.width; x += 3) {
          const wx = x + scrollX * 0.3;
          let h = duneNoise(wx * 0.7) * 0.75 * amplitudeScale * 0.5;
          dCtx.lineTo(x, dCanvas.height * yBaseFar - h);
        }
        dCtx.lineTo(dCanvas.width, dCanvas.height);
        dCtx.closePath();
        dCtx.fill();

        dCtx.fillStyle = colors.duneMid;
        dCtx.beginPath();
        dCtx.moveTo(0, dCanvas.height);
        for (let x = 0; x <= dCanvas.width; x += 3) {
          const wx = x + scrollX * 0.55;
          let h = duneNoise(wx) * 0.95 * amplitudeScale * 0.6;
          dCtx.lineTo(x, dCanvas.height * yBaseMid - h);
        }
        dCtx.lineTo(dCanvas.width, dCanvas.height);
        dCtx.closePath();
        dCtx.fill();

        dCtx.fillStyle = colors.duneNear;
        dCtx.beginPath();
        dCtx.moveTo(0, dCanvas.height);
        for (let x = 0; x <= dCanvas.width; x += 2) {
          const wx = x + scrollX * 0.9;
          let h = duneNoise(wx * 1.15) * amplitudeScale * 0.7;
          dCtx.lineTo(x, dCanvas.height * yBaseNear - h);
        }
        dCtx.lineTo(dCanvas.width, dCanvas.height);
        dCtx.closePath();
        dCtx.fill();
      }

      function animateDesert() {
        scrollX += speed;
        drawDunes();
        requestAnimationFrame(animateDesert);
      }
      animateDesert();

      window.addEventListener('resize', () => {
        resizeDesert();
        drawDunes();
      });
    })();
  </script>
</body>
</html>
