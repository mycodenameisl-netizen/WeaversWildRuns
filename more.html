<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100dvh;
            background: radial-gradient(circle at center, #0c0022 0%, #000000 80%);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1400px;
            position: relative;
            padding: 20px;
        }
        .stars-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px 3px rgba(255, 215, 100, 0.9);
            animation: twinkle 3s infinite alternate, drift 45s linear infinite;
        }
        @keyframes twinkle { 0% { opacity: 0.5; } 100% { opacity: 1; } }
        @keyframes drift { 0% { transform: translateY(120vh) rotate(0deg); } 100% { transform: translateY(-100px) rotate(720deg); } }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 35px;
            max-width: 560px;
            width: 100%;
            z-index: 10;
            padding-bottom: 160px; /* extra safe space for home button */
        }

        .card {
            width: 100%;
            aspect-ratio: 270 / 370;
            background: linear-gradient(135deg, #f8f0d8 0%, #e8d9b0 35%, #d9c38a 70%, #c9a96f 100%);
            border: 7px solid #c9a02f;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            font-weight: 900;
            color: #3c2f1e;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.35),
                         0 0 15px rgba(255, 215, 0, 0.5);
            box-shadow:
                0 18px 35px rgba(0, 0, 0, 0.75),
                inset 0 0 45px rgba(212, 175, 55, 0.35),
                inset 0 10px 25px rgba(255, 245, 210, 0.5),
                0 0 0 4px rgba(255, 215, 0, 0.3);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        .texture {
            position: absolute;
            inset: 0;
            border-radius: 15px;
            background-size: cover;
            mix-blend-mode: multiply;
            opacity: 0.78;
            pointer-events: none;
            z-index: 1;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255, 230, 120, 0.38) 0%, transparent 68%);
            pointer-events: none;
            mix-blend-mode: screen;
            animation: spectralOverlay 9s ease-in-out infinite;
            z-index: 2;
            border-radius: 15px;
        }
        @keyframes spectralOverlay {
            0%, 100% { opacity: 0.48; transform: scale(1); }
            50% { opacity: 0.72; transform: scale(1.08); }
        }

        .card {
            animation: float3D 14s ease-in-out infinite;
        }
        .card:nth-child(2) { animation-delay: -3.5s; }
        .card:nth-child(3) { animation-delay: -7s; }
        .card:nth-child(4) { animation-delay: -10.5s; }
        @keyframes float3D {
            0%, 100% { transform: rotateX(6deg) rotateY(-10deg) translateY(0) scale(1); }
            50% { transform: rotateX(-8deg) rotateY(12deg) translateY(-16px) scale(1.03); }
        }
        .card:hover {
            transform: rotateX(18deg) rotateY(22deg) scale(1.08) !important;
            border-color: #ffe066;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.85),
                        0 0 65px rgba(255, 215, 0, 0.75);
        }

        /* ==================== ZACH'S CARD ==================== */
        .zach-card {
            cursor: pointer;
        }
        .zach-card .photo-container {
            width: 100%;
            height: 52%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #3c2f1e;
            position: relative;
            z-index: 3;
        }
        .zach-card img {
            width: 86%;
            height: 86%;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid #c9a02f;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .zach-card .content {
            flex: 1;
            padding: 14px 18px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 4;
            position: relative;
        }
        .zach-card .content h3 {
            font-size: clamp(1.05rem, 4.2vw, 1.35rem);
            line-height: 1.15;
            margin-bottom: 6px;
        }
        .zach-card .content .name {
            font-size: clamp(0.92rem, 3.6vw, 1.1rem);
            font-weight: 700;
            margin-bottom: 8px;
        }

        /* Mobile fixes for text not getting cut off */
        @media (max-width: 480px) {
            .cards-container {
                padding-bottom: 180px;
                gap: 28px;
            }
            .zach-card .photo-container {
                height: 48%; /* give a bit more room for text on small screens */
            }
            .zach-card .content {
                padding: 12px 16px 18px;
            }
            .zach-card .content h3 {
                font-size: 1.1rem;
            }
            .zach-card .content .name {
                font-size: 0.98rem;
            }
            .zach-card .content p, .zach-card .content div {
                word-break: break-word;
                line-height: 1.3;
            }
        }

        /* HOME BUTTON - safe on all devices */
        .home-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #222;
            border: 3px solid #e6b800;
            border-radius: 999px;
            background: #FFCC00;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.95), inset 0 0 10px rgba(255, 235, 120, 0.7);
            z-index: 30;
            transition: all 0.3s ease;
        }
        .home-btn:hover {
            background: #FFDD33;
            box-shadow: 0 0 28px rgba(255, 204, 0, 1);
        }
    </style>
</head>
<body>
    <div class="stars-bg" id="stars-bg"></div>
    <div class="cards-container">

        <!-- ==================== CARD 1 - ZACH FUNDRAISER ==================== -->
        <div class="card zach-card" onclick="window.open('https://www.justgiving.com/page/macclesfieldmaternity?utm_medium=FR&utm_source=WA&fbclid=IwY2xjawRFst1leHRuA2FlbQIxMABicmlkETFXT2JjUDN4TGxTSW9WWTVUc3J0YwZhcHBfaWQQMjIyMDM5MTc4ODIwMDg5MgABHiLz16gV4hgQTteMH0Q-OPbAEjZo-26GGUayEJ8hyjd-26UiktSOCvjVCaFk_aem_ZhPeaY4ATHi8WkFTAcT3TQ', '_blank')">
            <div class="texture"></div>
            
            <div class="photo-container">
                <img src="ZACHFAM.jpg" alt="Zach Weaver family">
            </div>
            
            <div class="content">
                <h3>Support Macclesfield Maternity Units</h3>
                <div class="name">Fundraiser by Zachary Weaver-Shojaie</div>
            </div>
        </div>

        <!-- Other cards unchanged -->
        <div class="card">
            <div class="texture"></div>
            <span class="number">2</span>
        </div>

        <div class="card">
            <div class="texture"></div>
            <span class="number">3</span>
        </div>

        <div class="card">
            <div class="texture"></div>
            <span class="number">4</span>
        </div>

    </div>

    <!-- HOME BUTTON -->
    <a href="index.html" class="home-btn">Home</a>

    <script>
        // (Your existing star + texture script - unchanged)
        function createOrganicBlob(cx, cy, baseRadius, seed) {
            const points = 12 + Math.floor(Math.random() * 7);
            let path = `M ${cx + baseRadius} ${cy}`;
            const angleStep = (Math.PI * 2) / points;
            for (let i = 1; i <= points; i++) {
                const angle = i * angleStep + (Math.random() * 0.35 - 0.18);
                const radiusNoise = baseRadius * (0.72 + Math.random() * 0.68);
                const x = cx + Math.cos(angle) * radiusNoise;
                const y = cy + Math.sin(angle) * radiusNoise * (0.88 + Math.random() * 0.35);
                const cp1x = cx + Math.cos(angle - angleStep * 0.55) * baseRadius * 1.05;
                const cp1y = cy + Math.sin(angle - angleStep * 0.55) * baseRadius * 1.05;
                const cp2x = cx + Math.cos(angle - angleStep * 0.35) * baseRadius * 0.92;
                const cp2y = cy + Math.sin(angle - angleStep * 0.35) * baseRadius * 0.92;
                path += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${x} ${y}`;
            }
            path += ` Z`;
            return path;
        }
        function generateOldParchmentSVG(seed) {
            let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="340" height="440" viewBox="0 0 340 440">`;
            const freq = 0.42 + Math.random() * 0.55;
            const octaves = 4 + Math.floor(Math.random() * 2);
            svg += `<filter id="n${seed}" x="0" y="0" width="100%" height="100%">
                        <feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="${octaves}" stitchTiles="stitch"/>
                        <feColorMatrix type="saturate" values="0"/>
                    </filter>`;
            svg += `<rect width="340" height="440" filter="url(#n${seed})" opacity="0.78"/>`;
            const splodgeCount = 4 + Math.floor(Math.random() * 4);
            for (let i = 0; i < splodgeCount; i++) {
                const cx = 25 + Math.random() * 290;
                const cy = 25 + Math.random() * 390;
                const baseRadius = 38 + Math.random() * 72;
                const opacity = 0.06 + Math.random() * 0.11;
                const path = createOrganicBlob(cx, cy, baseRadius, seed + i);
                svg += `<path d="${path}" fill="#8c6a2e" opacity="${opacity}"/>`;
            }
            if (Math.random() > 0.35) {
                const y = 80 + Math.random() * 280;
                const wave = Math.random() * 18 + 8;
                let crease = `M 15 ${y}`;
                for (let x = 40; x < 325; x += 35) {
                    const offset = Math.sin(x / 45) * wave;
                    crease += ` Q ${x} ${y + offset}, ${x + 35} ${y + offset * 0.6}`;
                }
                svg += `<path d="${crease}" fill="none" stroke="#6b4e1f" stroke-width="3.5" opacity="0.22"/>`;
            }
            svg += `</svg>`;
            return `data:image/svg+xml,${encodeURIComponent(svg)}`;
        }
        function applyUniqueTextures() {
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                const textureDiv = card.querySelector('.texture');
                if (textureDiv) {
                    const svgUrl = generateOldParchmentSVG(index);
                    textureDiv.style.backgroundImage = `url('${svgUrl}')`;
                }
            });
        }
        function createBackgroundStars() {
            const container = document.getElementById('stars-bg');
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const size = Math.random() * 3.8 + 1.3;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `${Math.random() * 100}vh`;
                star.style.animationDelay = `-${Math.random() * 40}s`;
                star.style.animationDuration = `${Math.random() * 30 + 30}s`;
                star.style.opacity = Math.random() * 0.6 + 0.45;
                container.appendChild(star);
            }
        }
        createBackgroundStars();
        applyUniqueTextures();
    </script>
</body>
</html>
